{{ $dateFormat := site.Params.projectHub.dateFormat | default "2 January 2006" }}
<article>
  <div class="tl-stamp">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format $dateFormat }}</time>
  </div>

  <h3 class="tl-content">{{ .LinkTitle }}</h3>

  {{ with .RawContent }}
    <a href="{{ $.RelPermalink }}">View update</a>
  {{ end }}

  {{ partial "project-hub/artifacts.html" (dict "page" . "artifacts" .Params.artifacts "showDescriptions" false) }}
</article>
