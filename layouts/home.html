{{ define "main" }}
  <h1>{{ site.Title }}{{ with site.Params.projectHub.tagline }} {{ . }}{{ end }}</h1>
  <header>
    {{ with site.Params.projectHub.intro }}
      <p>{{ . }}</p>
    {{ end }}
    {{ with .Content }}
      <div>
        {{ . }}
      </div>
    {{ end }}
  </header>

  <section aria-label="Project updates">
    {{ partial "project-hub/update-list.html" . }}
  </section>
{{ end }}
