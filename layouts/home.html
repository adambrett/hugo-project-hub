{{ define "main" }}
  <header class="project-hub-header">
    <h1>
      {{ site.Title }}
      {{ with site.Params.projectHub.tagline }}
        <span>{{ . }}</span>
      {{ end }}
    </h1>
    {{ with site.Params.projectHub.intro }}
      <p class="project-hub-intro-copy">{{ . }}</p>
    {{ end }}
    {{ with .Content }}
      <div class="project-hub-intro">
        {{ . }}
      </div>
    {{ end }}
  </header>

  <section class="project-hub-updates" aria-label="Project updates">
    {{ partial "project-hub/update-list.html" . }}
  </section>
{{ end }}
